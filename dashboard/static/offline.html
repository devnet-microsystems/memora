<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Connection</title>
    <style>
        :root {
            --bg-color: #FBF8F3;
            --text-primary: #1B1B1F;
            --danger: #B3261E;
        }
        body {
            font-family: 'Atkinson Hyperlegible', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            text-align: center;
            padding: 40px 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        h1 { font-size: 28px; margin-bottom: 20px; }
        p { font-size: 20px; line-height: 1.5; margin-bottom: 40px; }
        .sos-btn {
            background-color: var(--danger);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            width: 100%;
            max-width: 350px;
        }
    </style>
</head>
<body>
    <h1>No connection</h1>
    <p>You are offline.<br>Please call your caregiver or <strong>112</strong> if this is an emergency.</p>
    <button class="sos-btn" onclick="alert('Cannot send SOS while offline. Please call 112 directly.')">SOS Alert (Offline)</button>
</body>
</html>
