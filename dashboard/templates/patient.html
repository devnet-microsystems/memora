<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memora - Paziente</title>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FAF9F6;
            --text-primary: #1A1A1A;
            --action-color: #0056B3;
        }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-primary);
            font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; 
            margin: 0;
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }
        *:focus-visible {
            outline: 3px solid var(--action-color) !important;
            outline-offset: 2px !important;
        }
        .hero { 
            flex: 1; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: flex-start; 
            padding: 2rem 1rem;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 2rem;
            text-align: center;
        }
        .mic-btn { 
            width: 180px; 
            height: 180px; 
            border-radius: 50%; 
            font-size: 4rem; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background-color: var(--action-color);
            color: #FFFFFF;
            border: none;
            cursor: pointer;
            margin-bottom: 2rem;
        }
        .mic-btn.active {
            background-color: #004085;
            box-shadow: 0 0 0 10px rgba(0, 86, 179, 0.3);
        }
        .mic-btn:disabled {
            background-color: #595959;
            cursor: not-allowed;
            box-shadow: none;
        }
        #voice-placeholder {
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 2rem;
        }
        #conversation-box {
            width: 100%;
            font-size: 1.5rem;
            line-height: 1.6;
            padding: 1rem;
            box-sizing: border-box;
            border-top: 2px solid #595959;
        }
        .msg { margin-bottom: 1.5rem; }
        .msg strong { display: block; font-size: 1.2rem; margin-bottom: 0.2rem; }
        .msg.tu strong { color: #595959; }
        .msg.memora strong { color: var(--action-color); }
        .top-bar { padding: 1rem; text-align: right; }
        .top-bar a { color: var(--action-color); font-size: 1.2rem; text-decoration: underline; font-weight: bold; }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="/caregiver">Pannello Caregiver</a>
    </div>

    <div class="hero">
        <h1>Parla con Memora</h1>
        <button class="mic-btn" id="btn-speak" onclick="startListening()" aria-label="Premi per parlare">🎙️</button>
        <div id="voice-placeholder">Tocca il microfono per parlare</div>
        
        <div id="conversation-box" aria-live="polite"></div>
    </div>

    <script>
        const btnSpeak = document.getElementById('btn-speak');
        const conversationBox = document.getElementById('conversation-box');
        const placeholder = document.getElementById('voice-placeholder');

        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg ' + (sender === 'Tu' ? 'tu' : 'memora');
            msgDiv.innerHTML = `<strong>${sender}</strong> <span>${text}</span>`;
            conversationBox.appendChild(msgDiv);
            window.scrollTo(0, document.body.scrollHeight);
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isProcessing = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'it-IT';
            recognition.interimResults = false;
            recognition.continuous = false;

            recognition.onstart = () => {
                btnSpeak.classList.add('active');
                placeholder.innerText = "Ti sto ascoltando...";
            };

            recognition.onresult = async (event) => {
                if (isProcessing) return;
                const result = event.results[event.results.length - 1];
                if (!result.isFinal) return;

                isProcessing = true;
                recognition.stop();
                btnSpeak.disabled = true;
                btnSpeak.classList.remove('active');
                placeholder.innerText = "Sto elaborando...";

                const speechResult = result[0].transcript;
                appendMessage('Tu', speechResult);
                await askAgent(speechResult);
            };

            recognition.onerror = (event) => {
                if (event.error === 'aborted') return;
                appendMessage('Sistema', "Non ho sentito bene, riprova.");
                speakResponse("Non ho sentito bene, riprova.");
            };

            recognition.onend = () => {
                if (!isProcessing) resetVoiceUI();
            };
        } else {
            placeholder.innerText = "Voce non supportata nel browser.";
            btnSpeak.disabled = true;
        }

        function resetVoiceUI() {
            isProcessing = false;
            btnSpeak.disabled = false;
            btnSpeak.classList.remove('active');
            placeholder.innerText = "Tocca il microfono per parlare";
        }

        function startListening() {
            if (recognition && !btnSpeak.disabled && !isProcessing) {
                recognition.start();
            }
        }

        async function askAgent(text) {
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_input: text })
                });
                if (!response.ok) throw new Error("API Error");
                const data = await response.json();
                appendMessage('Memora', data.response);
                speakResponse(data.response);
            } catch (error) {
                appendMessage('Sistema', "Errore di connessione.");
                speakResponse("C'è un errore di connessione.");
            }
        }

        function speakResponse(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'it-IT';
                utterance.rate = 0.9;
                utterance.onend = () => resetVoiceUI();
                utterance.onerror = () => resetVoiceUI();
                window.speechSynthesis.speak(utterance);
            } else {
                resetVoiceUI();
            }
        }
    </script>
</body>
</html>
