<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memora - Paziente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; flex-direction: column; min-height: 100vh; }
        .hero { flex: 1; display: flex; align-items: center; justify-content: center; }
        .mic-btn { width: 120px; height: 120px; border-radius: 50%; font-size: 3rem; display: flex; align-items: center; justify-content: center; margin: 0 auto; box-shadow: 0 10px 20px rgba(0,0,0,0.1); transition: all 0.3s ease; }
        .mic-btn:hover { transform: scale(1.05); }
        .mic-btn:active { transform: scale(0.95); }
        .pulse { animation: pulse-animation 2s infinite; }
        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(2dc157, 0.7); }
            70% { box-shadow: 0 0 0 30px rgba(45, 193, 87, 0); }
            100% { box-shadow: 0 0 0 0 rgba(45, 193, 87, 0); }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">🧠 Memora</a>
            <a href="/caregiver" class="btn btn-sm btn-outline-light">Vai alla Dashboard</a>
        </div>
    </nav>

    <div class="hero container py-5">
        <div class="row w-100 justify-content-center text-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-lg border-0 rounded-4 p-4">
                    <h2 class="mb-4 text-primary">Parla con Memora</h2>
                    <button class="btn btn-danger mic-btn mb-4" id="btn-speak" onclick="startListening()">🎙️</button>
                    <p class="lead text-muted mb-4" id="voice-placeholder">Tocca il microfono e fai una domanda.</p>
                    
                    <div id="conversation-box" class="p-3 bg-light rounded text-start" style="height: 250px; overflow-y: auto; font-size: 1.1rem;">
                        <!-- Chat messages will appear here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const btnSpeak = document.getElementById('btn-speak');
        const conversationBox = document.getElementById('conversation-box');
        const placeholder = document.getElementById('voice-placeholder');

        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'mb-3 pb-2 border-bottom';
            if (sender === 'Tu') {
                msgDiv.innerHTML = `<strong>Tu:</strong> <span style="font-style: italic;">${text}</span>`;
            } else if (sender === 'Memora') {
                msgDiv.innerHTML = `<strong class="text-primary">Memora:</strong> <span class="text-primary">${text}</span>`;
            } else {
                msgDiv.innerHTML = `<span class="text-muted small">${text}</span>`;
            }
            conversationBox.appendChild(msgDiv);
            conversationBox.scrollTop = conversationBox.scrollHeight;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isProcessing = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'it-IT';
            recognition.interimResults = false;
            recognition.continuous = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                btnSpeak.classList.replace('btn-danger', 'btn-success');
                btnSpeak.classList.add('pulse');
                placeholder.innerText = "Ti sto ascoltando...";
            };

            recognition.onresult = async (event) => {
                if (isProcessing) return;
                const result = event.results[event.results.length - 1];
                if (!result.isFinal) return;

                isProcessing = true;
                recognition.stop();
                btnSpeak.disabled = true;
                btnSpeak.classList.remove('btn-success', 'btn-danger', 'pulse');
                btnSpeak.classList.add('btn-secondary');
                placeholder.innerText = "Sto pensando...";

                const speechResult = result[0].transcript;
                appendMessage('Tu', speechResult);
                await askAgent(speechResult);
            };

            recognition.onerror = (event) => {
                if (event.error === 'aborted') return;
                console.error("Speech error:", event.error);
                appendMessage('Sistema', "Errore: " + event.error + ". Riprova.");
                speakResponse("Non ho capito, riprova.");
            };

            recognition.onend = () => {
                if (!isProcessing) {
                    resetVoiceUI();
                }
            };
        } else {
            placeholder.innerText = "API Vocale non supportata in questo browser.";
            btnSpeak.disabled = true;
        }

        function resetVoiceUI() {
            isProcessing = false;
            btnSpeak.disabled = false;
            btnSpeak.classList.remove('btn-success', 'btn-secondary', 'pulse');
            btnSpeak.classList.add('btn-danger');
            placeholder.innerText = "Tocca il microfono e fai una domanda.";
        }

        function startListening() {
            if (recognition && !btnSpeak.disabled && !isProcessing) {
                recognition.start();
            }
        }

        async function askAgent(text) {
            const loadingId = 'loading-' + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.id = loadingId;
            loadingDiv.className = 'text-muted small mb-2';
            loadingDiv.innerText = "Memora sta digitando...";
            conversationBox.appendChild(loadingDiv);
            conversationBox.scrollTop = conversationBox.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_input: text })
                });
                
                const loader = document.getElementById(loadingId);
                if (loader) loader.remove();
                
                if (!response.ok) throw new Error("Errore API");
                const data = await response.json();
                
                appendMessage('Memora', data.response);
                speakResponse(data.response);
            } catch (error) {
                console.error("Agent error:", error);
                const loader = document.getElementById(loadingId);
                if (loader) loader.remove();
                appendMessage('Sistema', "Errore di comunicazione con l'assistente.");
                speakResponse("Si è verificato un errore di connessione.");
            }
        }

        function speakResponse(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'it-IT';
                utterance.rate = 0.9;
                utterance.onend = () => { resetVoiceUI(); };
                utterance.onerror = () => { resetVoiceUI(); };
                window.speechSynthesis.speak(utterance);
            } else {
                resetVoiceUI();
            }
        }
    </script>
</body>
</html>
