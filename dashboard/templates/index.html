<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memora Dashboard - Caregiver View</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; }
        #network-graph { width: 100%; height: 400px; border: 1px solid #dee2e6; border-radius: 5px; background: white; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        #report-content {
            max-width: 900px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            color: #212529;
        }
        #report-content h1, #report-content h2, #report-content h3 { margin-top: 20px; color: #212529; }
        #report-content table { border-collapse: collapse; width: 100%; margin-bottom: 15px; }
        #report-content table th, #report-content table td { border: 1px solid #ddd; padding: 8px; }
        #report-content code { background: #e9ecef; padding: 2px 4px; border-radius: 3px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">🧠 Memora - Caregiver Hub</a>
            <span class="navbar-text text-white">
                Stato Assistente API: 
                <span class="{% if status == 'online' %}text-success bg-light px-2 rounded{% else %}text-danger bg-light px-2 rounded{% endif %}">
                    {{ status | upper }}
                </span>
            </span>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <!-- Left Column: Graph & Functions -->
            <div class="col-lg-8">
                <!-- Memory Graph -->
                <div class="card">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Grafo di Memoria (Knowledge Graph)</h5>
                        <button class="btn btn-sm btn-outline-primary" onclick="loadMemory()">Aggiorna</button>
                    </div>
                    <div class="card-body">
                        <div id="network-graph"></div>
                    </div>
                </div>

                <!-- Voice Assistant removed from Caregiver view - available in Patient mode -->

                <!-- Feature Toggles Placeholder -->
                <div class="card">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">Impostazioni Assistente</h5>
                    </div>
                    <div class="card-body">
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" id="toggleProactivity" checked>
                            <label class="form-check-label" for="toggleProactivity">Proattività (suggerisce aiuto in caso di stasi o anomalie)</label>
                        </div>
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" id="toggleWeb" checked>
                            <label class="form-check-label" for="toggleWeb">Ricerca Web con Tavily (Farmacie, Guardia Medica)</label>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="toggleMemoryWrite" checked>
                            <label class="form-check-label" for="toggleMemoryWrite">Apprendimento continuo (Scrittura di nuovi ricordi nel grafo)</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column: List & Report -->
            <div class="col-lg-4">
                <!-- Nodes List -->
                <div class="card">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">Gestione Ricordi</h5>
                    </div>
                    <div class="card-body p-0" style="max-height: 300px; overflow-y: auto;">
                        <ul class="list-group list-group-flush" id="node-list">
                            <li class="list-group-item text-muted">Caricamento in corso...</li>
                        </ul>
                    </div>
                </div>

                <!-- Report Section -->
                <div class="card">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Report Settimanale</h5>
                        <div>
                            <button class="btn btn-sm btn-secondary me-2" onclick="printReport()">Scarica PDF</button>
                            <button class="btn btn-sm btn-primary" id="btn-report" onclick="generateReport()">Genera</button>
                        </div>
                    </div>
                    <div class="card-body" style="max-height: 300px; overflow-y: auto;">
                        <div id="report-content" class="text-muted small">
                            Clicca su Genera per creare un report comportamentale sintetizzato da Nemotron 3 Ultra.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let network = null;

        async function loadMemory() {
            try {
                const response = await fetch('/api/memory');
                if (!response.ok) throw new Error("Errore API");
                const data = await response.json();
                
                renderGraph(data);
                renderList(data.nodes);
            } catch (error) {
                console.error("Failed to load memory:", error);
                document.getElementById('node-list').innerHTML = '<li class="list-group-item text-danger">Errore di connessione al backend (FastAPI non risponde).</li>';
            }
        }

        function renderGraph(data) {
            const container = document.getElementById('network-graph');
            
            // Map groups to colors
            const groupColors = {
                'person': '#97C2FC',
                'place': '#FFFF00',
                'event': '#FB7E81',
                'habit': '#7BE141',
                'med': '#FFA807',
                'flag': '#ff4d4d',
                'unknown': '#EB7DF4'
            };

            const nodes = data.nodes.map(n => ({
                id: n.id, 
                label: n.label, 
                group: n.group,
                color: groupColors[n.group] || groupColors['unknown']
            }));

            const graphData = {
                nodes: new vis.DataSet(nodes),
                edges: new vis.DataSet(data.edges)
            };
            
            const options = {
                nodes: { shape: 'dot', size: 20, font: { size: 14 } },
                edges: { arrows: 'to', font: { size: 12, align: 'middle' } },
                physics: { stabilization: false }
            };
            
            if(network) network.destroy();
            network = new vis.Network(container, graphData, options);
        }

        function renderList(nodes) {
            const list = document.getElementById('node-list');
            list.innerHTML = '';
            
            if(!nodes || nodes.length === 0) {
                list.innerHTML = '<li class="list-group-item text-muted">Nessun ricordo presente.</li>';
                return;
            }

            nodes.forEach(n => {
                const li = document.createElement('li');
                li.className = 'list-group-item d-flex justify-content-between align-items-center flex-wrap';
                li.innerHTML = `
                    <div class="mb-1">
                        <span class="badge bg-secondary me-2">${n.group}</span>
                        <strong>${n.label}</strong>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-sm btn-outline-warning" onclick="alert('Modifica in sviluppo.')">Correggi</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteNode('${n.id}')">Cancella</button>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        async function deleteNode(nodeId) {
            if(!confirm(`Diritto all'oblio: vuoi cancellare definitivamente il nodo "${nodeId}" e i suoi legami?`)) return;
            
            try {
                const response = await fetch(`/api/memory/${nodeId}`, { method: 'DELETE' });
                if(response.ok) {
                    loadMemory(); // Refresh UI
                } else {
                    alert("Errore durante la cancellazione.");
                }
            } catch (error) {
                console.error("Failed to delete node:", error);
            }
        }

        async function generateReport() {
            const btn = document.getElementById('btn-report');
            const content = document.getElementById('report-content');
            
            btn.disabled = true;
            btn.innerText = "Generazione...";
            content.innerHTML = "<span class='text-primary'>Invocazione Nemotron 3 Ultra in corso...</span>";

            try {
                const response = await fetch('/api/report', { method: 'POST' });
                if(!response.ok) throw new Error("Errore API");
                const data = await response.json();
                
                // Format response
                content.innerHTML = marked.parse(data.report);
            } catch (error) {
                console.error("Failed to generate report:", error);
                content.innerHTML = '<span class="text-danger">Errore. Assicurati che FastAPI e l\'API Nebius siano raggiungibili.</span>';
            } finally {
                btn.disabled = false;
                btn.innerText = "Genera";
            }
        }

        function printReport() {
            const reportHTML = document.getElementById('report-content').innerHTML;
            if (reportHTML.includes("Clicca su Genera") || reportHTML.includes("Invocazione Nemotron")) {
                alert("Genera prima il report.");
                return;
            }
            
            const printWindow = window.open('', '', 'height=600,width=800');
            printWindow.document.write('<html><head><title>Memora Report Settimanale</title>');
            printWindow.document.write('<style>');
            printWindow.document.write('body { font-family: Arial, sans-serif; padding: 20px; line-height: 1.6; color: #333; }');
            printWindow.document.write('h1, h2, h3 { margin-top: 20px; }');
            printWindow.document.write('table { border-collapse: collapse; width: 100%; margin-bottom: 15px; }');
            printWindow.document.write('table th, table td { border: 1px solid #ddd; padding: 8px; text-align: left; }');
            printWindow.document.write('table th { background-color: #f2f2f2; }');
            printWindow.document.write('code { background: #e9ecef; padding: 2px 4px; border-radius: 3px; }');
            printWindow.document.write('</style>');
            printWindow.document.write('</head><body>');
            printWindow.document.write(reportHTML);
            printWindow.document.write('</body></html>');
            printWindow.document.close();
            
            // Wait for resources to load before printing
            setTimeout(() => {
                printWindow.focus();
                printWindow.print();
            }, 250);
        }

        // Initialize and auto-refresh
        document.addEventListener('DOMContentLoaded', () => {
            loadMemory();
            // Auto-refresh graph every 10 seconds without manual interaction
            setInterval(loadMemory, 10000);
        });
    </script>
</body>
</html>
