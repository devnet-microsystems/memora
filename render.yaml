# Render hosts the Flask dashboard only. The FastAPI backend (with its persistent encrypted DB) runs on Fly.io
# (see fly.toml). Set API_URL to the Fly.io app URL in the Render dashboard.
services:
  - type: web
    name: memora-dashboard
    env: python
    buildCommand: |
      pip install -r requirements.txt
      # Install Node.js for React/Vite frontend build (no root required)
      curl -fsSL https://nodejs.org/dist/v18.18.0/node-v18.18.0-linux-x64.tar.xz | tar -xJ -C /tmp
      export PATH=/tmp/node-v18.18.0-linux-x64/bin:$PATH
      cd frontend && npm ci && npm run build
    startCommand: "gunicorn dashboard.app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: API_URL
        sync: false            # e.g. https://memora-y2ebcg.fly.dev
      - key: MEMORA_API_KEY
        sync: false
      - key: CAREGIVER_USER
        sync: false
      - key: CAREGIVER_PASSWORD
        sync: false
      - key: DEMO_PUBLIC_READONLY
        value: "1"
      - key: MAX_DAILY_LLM_CALLS
        value: "500"
